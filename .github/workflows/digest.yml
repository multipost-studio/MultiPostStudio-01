name: Weekly digest

# Emails the per-workspace weekly analytics digest. Vercel Hobby cron is capped
# at once/day and already used by tick; this runs the digest on a weekly
# schedule instead. The endpoint no-ops on non-Mondays, so an occasional
# GitHub delay is harmless.
#
# Required repo secrets:
#   DEPLOY_URL   e.g. https://cadence.vercel.app   (no trailing slash)
#   CRON_SECRET  same value as the Vercel env var

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if it's not Monday"
        type: boolean
        default: false

# No checkout, no repo access of any kind — this job only curls an external URL.
permissions: {}

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/digest
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          FORCE: ${{ inputs.force }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "DEPLOY_URL secret not set yet — skipping (deploy first)."
            exit 0
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set in GitHub repository secrets! Protected cron endpoints will return 401 Unauthorized."
          fi

          BASE_URL=$(echo "$DEPLOY_URL" | tr -d '[:space:]' | sed 's:/*$::')
          URL="$BASE_URL/api/cron/digest"
          if [ "$FORCE" = "true" ]; then URL="$URL?force=1"; fi

          echo "Pinging: $URL"

          TMP_RESPONSE=$(mktemp)
          HTTP_CODE=$(curl -sS -L \
            --post301 --post302 --post303 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -w "%{http_code}" \
            -o "$TMP_RESPONSE" \
            "$URL")

          BODY=$(cat "$TMP_RESPONSE" 2>/dev/null || echo "")
          rm -f "$TMP_RESPONSE"

          echo "digest -> HTTP $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Weekly digest succeeded."
            exit 0
          else
            echo "::error::Weekly digest failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi
