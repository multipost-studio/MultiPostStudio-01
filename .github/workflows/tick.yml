name: Publish tick

# Drives scheduled publishing + automations on Vercel Hobby, where Vercel Cron
# is capped at once per day. GitHub's scheduled runs are best-effort (often
# delayed 5-15 min under load) — for tighter timing use an external scheduler
# (cron-job.org etc.) hitting the same endpoint.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_URL   e.g. https://cadence.vercel.app   (no trailing slash)
#   CRON_SECRET  same value as the Vercel env var

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

# No checkout, no repo access of any kind — this job only curls an external URL.
permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/cron/tick
        env:
          DEPLOY_URL: ${{ secrets.DEPLOY_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "DEPLOY_URL secret not set yet — skipping (deploy first)."
            exit 0
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET is not set in GitHub repository secrets! Protected cron endpoints will return 401 Unauthorized."
          fi

          BASE_URL=$(echo "$DEPLOY_URL" | tr -d '[:space:]' | sed 's:/*$::')
          TARGET_URL="$BASE_URL/api/cron/tick"

          echo "Pinging: $TARGET_URL"

          TMP_RESPONSE=$(mktemp)
          HTTP_CODE=$(curl -sS -L \
            --post301 --post302 --post303 \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -w "%{http_code}" \
            -o "$TMP_RESPONSE" \
            "$TARGET_URL")

          BODY=$(cat "$TMP_RESPONSE" 2>/dev/null || echo "")
          rm -f "$TMP_RESPONSE"

          echo "tick -> HTTP $HTTP_CODE"
          echo "Response: $BODY"

          if [ "$HTTP_CODE" = "200" ]; then
            echo "Publish tick succeeded."
            exit 0
          else
            echo "::error::Publish tick failed with HTTP $HTTP_CODE: $BODY"
            exit 1
          fi
