# Local production-like stack: Postgres + migrations + web + publish worker.
# `docker compose up --build`. Put real integration keys in a .env file first
# (see .env.example) — anything left unset runs in stub mode.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cadence
      POSTGRES_PASSWORD: cadence
      POSTGRES_DB: cadence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cadence"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: apply migrations before web/worker start. Built from the `build`
  # stage because the slim runtime image has no Prisma CLI.
  migrate:
    build:
      context: .
      target: build
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://cadence:cadence@db:5432/cadence
    command: npx prisma migrate deploy
    restart: "no"

  web:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://cadence:cadence@db:5432/cadence
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-change-me-in-real-deploys}
      APP_URL: ${APP_URL:-http://localhost:3000}
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      target: build
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://cadence:cadence@db:5432/cadence
    env_file:
      - path: .env
        required: false
    command: npm run worker

volumes:
  pgdata:
